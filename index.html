<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 相關企業資本支出追蹤</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Microsoft JhengHei', sans-serif; background: #0f0c29; color: #fff; min-height: 100vh; padding: 20px; }
.header { background: linear-gradient(135deg, #667eea, #764ba2); padding: 30px; border-radius: 15px; text-align: center; margin-bottom: 30px; }
.header h1 { font-size: 2rem; margin-bottom: 10px; }
.header p { color: rgba(255,255,255,0.8); font-size: 0.95rem; }
.container { max-width: 1400px; margin: 0 auto; }
.chart-container { background: rgba(255,255,255,0.1); border-radius: 15px; padding: 30px; margin-bottom: 30px; }
.chart-container h2 { margin-bottom: 20px; color: #ffd700; }
canvas { max-height: 450px; }
.data-table { background: rgba(255,255,255,0.1); border-radius: 15px; padding: 20px; overflow-x: auto; }
.data-table h2 { margin-bottom: 20px; color: #ffd700; }
table { width: 100%; border-collapse: collapse; min-width: 900px; }
th, td { padding: 10px 8px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 0.85rem; }
th { background: rgba(102,126,234,0.5); color: #fff; position: sticky; top: 0; white-space: nowrap; }
.year-header { background: rgba(102,126,234,0.3) !important; }
.current-col { background: rgba(255,215,0,0.15) !important; color: #ffd700; font-weight: bold; }
.positive { color: #00d26a; }
.negative { color: #e94560; }
.legend { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; margin-top: 15px; }
.legend-item { display: flex; align-items: center; gap: 5px; font-size: 0.85rem; }
.legend-color { width: 14px; height: 14px; border-radius: 3px; }
.footer { text-align: center; margin-top: 40px; color: rgba(255,255,255,0.5); font-size: 0.85rem; }
</style>
</head>
<body>
<div class="header">
<h1>💰 AI 相關企業資本支出 (CapEx) 追蹤</h1>
<p>追蹤輝達、Google、Tesla、美光、台積電等主要 AI 供應鏈資本支出變化 | 更新: 2026-05-07 14:02</p>
</div>

<div class="container">
<div class="chart-container">
<h2>📊 各企業 CapEx 對比圖（十億美元）</h2>
<canvas id="groupedChart"></canvas>
<div class="legend" id="chartLegend"></div>
</div>

<div class="data-table">
<h2>📈 歷年 CapEx 數據（十億美元）</h2>
<table>
<thead>
<tr id="tableHeader">
<th>企業</th>
</tr>
</thead>
<tbody id="tableBody">
</tbody>
</table>
</div>
</div>

<div class="footer">
<p>數據來源：Yahoo Finance | 僅供參考，不構成投資建議</p>
</div>

<script>
const years = ["2021", "2022", "2023", "2024", "2025", "2026"];

const chartData = [{"label": "\u8f1d\u9054", "data": [null, NaN, 1.83, 1.07, 3.24, 6.04], "backgroundColor": "rgba(255, 99, 132, 0.7)", "borderColor": "rgba(255, 99, 132, 1)", "borderWidth": 2, "borderRadius": 5}, {"label": "Google", "data": [NaN, 31.48, 32.25, 52.54, 91.45, null], "backgroundColor": "rgba(54, 162, 235, 0.7)", "borderColor": "rgba(54, 162, 235, 1)", "borderWidth": 2, "borderRadius": 5}, {"label": "Tesla", "data": [NaN, 7.17, 8.9, 11.34, 8.53, null], "backgroundColor": "rgba(255, 206, 86, 0.7)", "borderColor": "rgba(255, 206, 86, 1)", "borderWidth": 2, "borderRadius": 5}, {"label": "\u7f8e\u5149", "data": [NaN, 12.07, 7.68, 8.39, 15.86, null], "backgroundColor": "rgba(75, 192, 192, 0.7)", "borderColor": "rgba(75, 192, 192, 1)", "borderWidth": 2, "borderRadius": 5}, {"label": "\u53f0\u7a4d\u96fb", "data": [NaN, 1089.63, 955.4, 964.98, 1282.6, null], "backgroundColor": "rgba(153, 102, 255, 0.7)", "borderColor": "rgba(153, 102, 255, 1)", "borderWidth": 2, "borderRadius": 5}, {"label": "\u83ef\u90a6\u96fb", "data": [NaN, 42.55, 14.12, 17.53, 6.87, null], "backgroundColor": "rgba(255, 159, 64, 0.7)", "borderColor": "rgba(255, 159, 64, 1)", "borderWidth": 2, "borderRadius": 5}, {"label": "\u65e5\u6708\u5149", "data": [NaN, 4.45, 2.21, 1.52, 1.38, null], "backgroundColor": "rgba(199, 199, 199, 0.7)", "borderColor": "rgba(199, 199, 199, 1)", "borderWidth": 2, "borderRadius": 5}];

const companyData = {"NVDA": {"name": "\u8f1d\u9054", "history": {"2022": NaN, "2023": 1.83, "2024": 1.07, "2025": 3.24, "2026": 6.04}, "latest": 6.04, "yoy": 86.41975308641973}, "GOOGL": {"name": "Google", "history": {"2021": NaN, "2022": 31.48, "2023": 32.25, "2024": 52.54, "2025": 91.45}, "latest": 91.45, "yoy": 74.05786067757899}, "TSLA": {"name": "Tesla", "history": {"2021": NaN, "2022": 7.17, "2023": 8.9, "2024": 11.34, "2025": 8.53}, "latest": 8.53, "yoy": -24.779541446208118}, "MU": {"name": "\u7f8e\u5149", "history": {"2021": NaN, "2022": 12.07, "2023": 7.68, "2024": 8.39, "2025": 15.86}, "latest": 15.86, "yoy": 89.03456495828365}, "2330.TW": {"name": "\u53f0\u7a4d\u96fb", "history": {"2021": NaN, "2022": 1089.63, "2023": 955.4, "2024": 964.98, "2025": 1282.6}, "latest": 1282.6, "yoy": 32.91467180666955}, "2344.TW": {"name": "\u83ef\u90a6\u96fb", "history": {"2021": NaN, "2022": 42.55, "2023": 14.12, "2024": 17.53, "2025": 6.87}, "latest": 6.87, "yoy": -60.81003993154592}, "3714.TW": {"name": "\u65e5\u6708\u5149", "history": {"2021": NaN, "2022": 4.45, "2023": 2.21, "2024": 1.52, "2025": 1.38}, "latest": 1.38, "yoy": -9.210526315789481}};

// 動態生成表格頭
const headerRow = document.getElementById('tableHeader');
years.forEach(year => {
    const th = document.createElement('th');
    th.className = 'year-header';
    th.textContent = year + '年';
    th.setAttribute('colspan', '2');
    headerRow.appendChild(th);
});

// 新增最新欄
const thLatest = document.createElement('th');
thLatest.className = 'current-col';
thLatest.textContent = '最新';
thLatest.setAttribute('colspan', '2');
headerRow.appendChild(thLatest);

// 生成表格
const tbody = document.getElementById('tableBody');
const colorMap = {
    0: 'rgb(255, 99, 132)',
    1: 'rgb(54, 162, 235)',
    2: 'rgb(255, 206, 86)',
    3: 'rgb(75, 192, 192)',
    4: 'rgb(153, 102, 255)',
    5: 'rgb(255, 159, 64)',
    6: 'rgb(199, 199, 199)',
};

let idx = 0;
for (const [code, co] of Object.entries(companyData)) {
    const tr = document.createElement('tr');
    
    const tdName = document.createElement('td');
    tdName.style.fontWeight = 'bold';
    tdName.style.color = colorMap[idx % 7];
    tdName.textContent = co.name;
    tr.appendChild(tdName);
    
    years.forEach(year => {
        const value = co.history[year];
        if (value !== undefined) {
            const tdVal = document.createElement('td');
            tdVal.textContent = '$' + value.toFixed(2) + 'B';
            tr.appendChild(tdVal);
            
            const yearIdx = years.indexOf(year);
            if (yearIdx > 0) {
                const prevYear = years[yearIdx - 1];
                const prevVal = co.history[prevYear];
                const tdYoy = document.createElement('td');
                if (prevVal && prevVal !== 0) {
                    const yoy = (value - prevVal) / prevVal * 100;
                    tdYoy.className = yoy >= 0 ? 'positive' : 'negative';
                    tdYoy.textContent = (yoy >= 0 ? '+' : '') + yoy.toFixed(1) + '%';
                } else {
                    tdYoy.textContent = '-';
                }
                tr.appendChild(tdYoy);
            } else {
                const tdYoy = document.createElement('td');
                tdYoy.textContent = '-';
                tr.appendChild(tdYoy);
            }
        } else {
            const tdVal = document.createElement('td');
            tdVal.style.color = 'rgba(255,255,255,0.3)';
            tdVal.textContent = '-';
            tr.appendChild(tdVal);
            tr.appendChild(document.createElement('td'));
        }
    });
    
    // 最新
    const tdLatest = document.createElement('td');
    tdLatest.className = 'current-col';
    tdLatest.textContent = '$' + co.latest.toFixed(2) + 'B';
    tr.appendChild(tdLatest);
    
    // YoY
    const tdYoy = document.createElement('td');
    tdYoy.className = co.yoy >= 0 ? 'positive' : 'negative';
    tdYoy.textContent = (co.yoy >= 0 ? '+' : '') + co.yoy.toFixed(1) + '%';
    tr.appendChild(tdYoy);
    
    tbody.appendChild(tr);
    idx++;
}

// 繪製圖表
const ctx = document.getElementById('groupedChart').getContext('2d');
new Chart(ctx, {
    type: 'bar',
    data: {
        labels: years.map(y => y + '年'),
        datasets: chartData
    },
    options: {
        responsive: true,
        maintainAspectRatio: true,
        plugins: {
            legend: { display: false }
        },
        scales: {
            y: {
                ticks: { color: '#fff' },
                grid: { color: 'rgba(255,255,255,0.1)' },
                title: {
                    display: true,
                    text: 'CapEx (十億美元)',
                    color: '#fff'
                }
            },
            x: {
                ticks: { color: '#fff' },
                grid: { color: 'rgba(255,255,255,0.1)' }
            }
        }
    }
});

// 圖例
const legendContainer = document.getElementById('chartLegend');
Object.entries(companyData).forEach(([code, co], i) => {
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.innerHTML = '<div class="legend-color" style="background:' + colorMap[i % 7] + '"></div><span>' + co.name + '</span>';
    legendContainer.appendChild(item);
});
</script>
</body>
</html>
